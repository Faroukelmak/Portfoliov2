<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1036"/><stop offset="1" stop-color="#0C0719"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A9FF"/><stop offset="1" stop-color="#6C8CF5" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#A855F7" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".3" r=".6">
      <stop offset="0" stop-color="#A855F7" stop-opacity=".28"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- chart card -->
  <g transform="translate(170 210)">
    <rect width="720" height="560" rx="28" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".12"/>
    <g stroke="#fff" stroke-opacity=".10">
      <path d="M70 470H660M70 380H660M70 290H660M70 200H660M70 110H660"/>
    </g>
    <rect x="110" y="300" width="72" height="170" rx="10" fill="url(#bar)"/>
    <rect x="220" y="230" width="72" height="240" rx="10" fill="url(#bar)"/>
    <rect x="330" y="120" width="72" height="350" rx="10" fill="url(#hl)"/>
    <rect x="440" y="260" width="72" height="210" rx="10" fill="url(#bar)"/>
    <rect x="550" y="190" width="72" height="280" rx="10" fill="url(#bar)"/>
    <circle cx="366" cy="92" r="9" fill="#fff"/>
    <path d="M366 92L520 40" stroke="#fff" stroke-opacity=".5" stroke-dasharray="6 8" stroke-width="2"/>
  </g>

  <!-- QA bubbles -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(960 250)">
      <rect width="470" height="120" rx="24" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/>
      <text x="32" y="50" font-size="22" fill="#fff" fill-opacity=".55" letter-spacing="3">QUESTION</text>
      <text x="32" y="88" font-size="30" fill="#fff">Which year has the highest value?</text>
    </g>
    <g transform="translate(1040 400)">
      <rect width="390" height="120" rx="24" fill="#A855F7" fill-opacity=".22" stroke="#C9A9FF" stroke-opacity=".5"/>
      <text x="32" y="50" font-size="22" fill="#C9A9FF" letter-spacing="3">QWEN · LoRA</text>
      <text x="32" y="90" font-size="34" font-weight="600" fill="#fff">2021</text>
    </g>
    <g transform="translate(960 600)">
      <text font-size="76" font-weight="600" fill="#fff" letter-spacing="-2">0.75<tspan fill="#C9A9FF">%</tspan></text>
      <text y="48" font-size="24" fill="#fff" fill-opacity=".55">trainable parameters</text>
      <text x="300" font-size="76" font-weight="600" fill="#fff" letter-spacing="-2">5<tspan fill="#C9A9FF">×</tspan></text>
      <text x="300" y="48" font-size="24" fill="#fff" fill-opacity=".55">throughput</text>
    </g>
  </g>
</svg>
